<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام إدارة الجداول والمناوبات</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0b1f3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html,body{margin:0;height:100%;background:#0b1f3a;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  #splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:#0b1f3a;color:#fff;font-family:system-ui,sans-serif;font-size:16px;transition:opacity .4s}
</style>
</head>
<body>
<div id="splash">جاري التحميل…</div>
<iframe id="app" allow="clipboard-write; fullscreen"></iframe>
<script>
  // ====== غيّر السطر ده بس: رابط الـ Web App بتاعك (اللي بينتهي بـ /exec) ======
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbyMKCgicL9rxXKaMUtH9Z15hDbS-Ok8bznA4D2KUYFrQYZYIr6y8Zevyz_BmALBFdLh/exec';
  // =========================================================================
  const f = document.getElementById('app');
  f.addEventListener('load', () => {
    const s = document.getElementById('splash');
    s.style.opacity = 0; setTimeout(() => s.remove(), 400);
  });
  f.src = GAS_URL;
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  }
</script>
</body>
</html>
